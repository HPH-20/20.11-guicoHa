<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>教师节快乐 - 老师</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@500;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #f6f4ee;
            --card-bg: #fffdf9;
            --olive-dark: #435747;
            --olive-light: #899e8d;
            --gold-accent: #c5a059;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            background-image: radial-gradient(#dfd9cc 1px, transparent 1px);
            background-size: 24px 24px;
            font-family: 'Noto Serif SC', serif;
            color: var(--olive-dark);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            padding: 20px;
        }

        #envelope-overlay {
            position: fixed;
            inset: 0;
            background: linear-gradient(135deg, #f4f1ea 0%, #e6e1d3 100%);
            z-index: 1000;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            transition: opacity 0.9s ease, visibility 0.9s ease;
        }

        #envelope-overlay.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .envelope-box {
            background: var(--card-bg);
            padding: 40px 30px;
            border-radius: 18px;
            box-shadow: 0 18px 40px rgba(67, 87, 71, 0.14);
            border: 1px solid rgba(197, 160, 89, 0.4);
            text-align: center;
            max-width: 340px;
            width: 100%;
        }

        .seal-icon {
            width: 66px;
            height: 66px;
            background-color: var(--olive-dark);
            color: #fff;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 18px;
            font-family: 'Ma Shan Zheng', cursive;
            font-size: 30px;
            box-shadow: 0 5px 18px rgba(67, 87, 71, 0.3);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.07); }
        }

        .open-btn {
            margin-top: 22px;
            padding: 12px 32px;
            background-color: var(--olive-dark);
            color: #fff;
            border: none;
            border-radius: 30px;
            font-size: 16px;
            font-family: 'Noto Serif SC', serif;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 6px 20px rgba(67, 87, 71, 0.25);
        }

        .open-btn:active {
            transform: scale(0.96);
        }

        .card-container {
            max-width: 480px;
            width: 100%;
            background: var(--card-bg);
            border-radius: 22px;
            padding: 26px;
            box-shadow: 0 22px 55px rgba(67, 87, 71, 0.12);
            border: 1px solid rgba(197, 160, 89, 0.4);
            opacity: 0;
            transform: translateY(25px);
            transition: all 1.1s ease 0.2s;
            z-index: 10;
        }

        .card-container.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .card-inner-border {
            border: 1px solid rgba(137, 158, 141, 0.35);
            border-radius: 16px;
            padding: 30px 22px;
            text-align: center;
        }

        .date-tag {
            font-family: 'Cormorant Garamond', serif;
            font-size: 14px;
            letter-spacing: 3.5px;
            color: var(--gold-accent);
            margin-bottom: 18px;
            font-weight: 600;
        }

        .polaroid-card {
            background: #ffffff;
            padding: 10px 10px 22px 10px;
            border-radius: 6px;
            box-shadow: 0 10px 28px rgba(0, 0, 0, 0.08);
            border: 1px solid #ece8df;
            max-width: 230px;
            margin: 0 auto 26px;
            transform: rotate(-1.5deg);
            position: relative;
        }

        .washi-tape {
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%) rotate(2deg);
            width: 75px;
            height: 20px;
            background-color: rgba(197, 160, 89, 0.35);
            z-index: 5;
        }

        .teacher-photo {
            width: 100%;
            aspect-ratio: 3 / 4;
            object-fit: cover;
            object-position: center top;
            border-radius: 3px;
            display: block;
            background-color: #f0ede6;
        }

        .chinese-message {
            font-size: 19.5px;
            line-height: 2;
            color: var(--olive-dark);
            font-weight: 600;
            letter-spacing: 1px;
            padding: 0 8px;
        }

        .divider-dot {
            color: var(--gold-accent);
            margin: 18px 0 12px;
            font-size: 14px;
            letter-spacing: 6px;
        }

        .signature {
            font-family: 'Ma Shan Zheng', cursive;
            font-size: 22px;
            color: var(--olive-light);
        }

        .music-control {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: var(--card-bg);
            border: 1px solid rgba(197, 160, 89, 0.5);
            color: var(--olive-dark);
            padding: 7px 14px 7px 9px;
            border-radius: 40px;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(0,0,0,0.08);
            z-index: 100;
            font-size: 13px;
        }

        .vinyl-disc {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: radial-gradient(circle, var(--gold-accent) 22%, #2b2b2b 25%, #1a1a1a 100%);
            border: 2px solid var(--olive-light);
        }

        .vinyl-disc.spin {
            animation: spin 4.5s linear infinite;
        }

        @keyframes spin {
            100% { transform: rotate(360deg); }
        }

        .petal {
            position: fixed;
            top: -20px;
            background-color: rgba(137, 158, 141, 0.35);
            border-radius: 15px 0 15px 0;
            pointer-events: none;
            z-index: 1;
            animation: fall linear forwards;
        }

        @keyframes fall {
            to { transform: translateY(105vh) rotate(360deg); }
        }
    </style>
</head>
<body>

    <div id="envelope-overlay">
        <div class="envelope-box" onclick="openCard()">
            <div class="seal-icon">敬</div>
            <div style="font-family: 'Ma Shan Zheng', cursive; font-size: 26px; color: var(--olive-dark);">致敬爱的老师</div>
            <button class="open-btn">打开信封</button>
        </div>
    </div>

    <div class="card-container" id="main-card">
        <div class="card-inner-border">
            <div class="date-tag">20 • 11 • HAPPY TEACHERS' DAY</div>

            <div class="polaroid-card">
                <div class="washi-tape"></div>
                <img id="teacher-img" src="coha.jpg" alt="老师" class="teacher-photo">
            </div>

            <div class="chinese-message">
                敬爱的老师，遇见您是我们的幸运。<br>
                教师节快乐！祝老师永远平安、幸福，保持内心的安宁与温柔。
            </div>

            <div class="divider-dot">• ✦ •</div>
            <div class="signature">您的学生</div>
        </div>
    </div>

    <button class="music-control" id="music-btn" onclick="toggleMusic()" style="display: none;">
        <div class="vinyl-disc spin" id="vinyl-disc"></div>
        <span id="music-text">《遇见》</span>
    </button>

    <audio id="bg-music" loop preload="auto" playsinline>
        <source src="gapgo.mp3" type="audio/mpeg">
        <source src="Gặp gỡ.mp3" type="audio/mpeg">
    </audio>

    <script>
        const img = document.getElementById('teacher-img');
        const imgCandidates = ['coha.jpg', 'coha.png', 'Ảnh.jpg', 'Ảnh.png', 'Ảnh.jpeg'];
        let imgIndex = 0;
        img.onerror = function() {
            imgIndex++;
            if (imgIndex < imgCandidates.length) {
                img.src = imgCandidates[imgIndex];
            }
        };

        const audio = document.getElementById('bg-music');
        const musicBtn = document.getElementById('music-btn');
        const vinylDisc = document.getElementById('vinyl-disc');
        const musicText = document.getElementById('music-text');
        let isPlaying = false;
        let isOpened = false;

        window.addEventListener('DOMContentLoaded', () => {
            audio.load();
        });

        function openCard() {
            if (isOpened) return;
            isOpened = true;

            document.getElementById('envelope-overlay').classList.add('hidden');
            document.getElementById('main-card').classList.add('visible');
            musicBtn.style.display = 'flex';

            audio.volume = 0.8;
            audio.play().then(() => {
                isPlaying = true;
                vinylDisc.classList.add('spin');
                musicText.innerText = "《遇见》";
            }).catch(error => {
                console.log("Audio play blocked:", error);
                isPlaying = false;
                vinylDisc.classList.remove('spin');
                musicText.innerText = "点击播放音乐";
            });

            startPetals();
        }

        function toggleMusic() {
            if (isPlaying) {
                audio.pause();
                vinylDisc.classList.remove('spin');
                musicText.innerText = "已暂停";
            } else {
                audio.play().then(() => {
                    isPlaying = true;
                    vinylDisc.classList.add('spin');
                    musicText.innerText = "《遇见》";
                }).catch(e => console.log(e));
            }
            isPlaying = !isPlaying;
        }

        function startPetals() {
            setInterval(() => {
                const petal = document.createElement('div');
                petal.classList.add('petal');
                const size = Math.random() * 9 + 7 + 'px';
                petal.style.width = size;
                petal.style.height = size;
                petal.style.left = Math.random() * 100 + 'vw';
                petal.style.animationDuration = Math.random() * 5 + 6 + 's';
                document.body.appendChild(petal);
                setTimeout(() => petal.remove(), 11000);
            }, 700);
        }
    </script>
</body>
</html>
